<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quiz Dev Perso">
<title>Quiz - Développement Personnel</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --accent:#2563eb; --accent-soft:#dbeafe;
    --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2;
    --warn:#ea580c;
    --shadow:0 6px 22px rgba(15,23,42,.08); --radius:18px;
  }
  html[data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
    --line:#334155; --accent:#60a5fa; --accent-soft:#1e3a5f;
    --ok:#22c55e; --ok-soft:#14532d; --bad:#f87171; --bad-soft:#4c1d1d;
    --warn:#fb923c;
    --shadow:0 6px 22px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px; line-height:1.55;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased; transition:background .2s,color .2s;
  }
  .wrap{max-width:680px; margin:0 auto; padding:16px 16px 48px;}

  .topbar{display:flex; align-items:center; gap:12px; margin:6px 0 4px;}
  .topbar h1{font-size:1.4rem; margin:0; letter-spacing:-.02em; flex:1}
  .sub{color:var(--muted); font-size:.92rem; margin:0 0 18px}
  .icon-btn{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    width:42px; height:42px; border-radius:12px; font-size:1.2rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; transition:transform .1s;
  }
  .icon-btn:active{transform:scale(.92)}

  .globalcard{
    background:linear-gradient(135deg,var(--accent),#7c3aed);
    color:#fff; border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .globalcard .lbl{font-size:.85rem; opacity:.9}
  .globalcard .big{font-size:1.7rem; font-weight:700; letter-spacing:-.02em; margin:2px 0 0}
  .globalcard .row{display:flex; gap:18px; margin-top:10px; font-size:.85rem; opacity:.95}
  .globalcard .row b{font-size:1.05rem}

  .actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px}
  .action{
    border:none; cursor:pointer; border-radius:14px; padding:15px 14px; text-align:left;
    font-size:1rem; font-weight:600; color:var(--text); background:var(--card);
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:3px; transition:transform .1s;
  }
  .action:active{transform:scale(.97)}
  .action .em{font-size:1.4rem}
  .action small{font-weight:500; color:var(--muted); font-size:.8rem}
  .action.primary{background:var(--accent); color:#fff}
  .action.primary small{color:rgba(255,255,255,.85)}

  .section-title{font-size:.82rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); font-weight:700; margin:4px 4px 12px}

  .bloc{
    background:var(--card); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;
    box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; gap:14px; transition:transform .1s;
  }
  .bloc:active{transform:scale(.98)}
  .bloc .chip{
    flex:0 0 auto; width:46px; height:46px; border-radius:13px; display:flex;
    align-items:center; justify-content:center; font-weight:800; font-size:1rem;
    background:var(--accent-soft); color:var(--accent);
  }
  .bloc .info{flex:1; min-width:0}
  .bloc .info h3{margin:0 0 6px; font-size:1.02rem; line-height:1.3}
  .bloc .meta{display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--muted)}
  .badge{background:var(--ok-soft); color:var(--ok); padding:2px 9px; border-radius:99px; font-weight:700; font-size:.74rem}
  .bloc .arrow{color:var(--muted); font-size:1.3rem; flex:0 0 auto}

  /* Quiz */
  .study-head{display:flex; align-items:center; gap:10px; margin:6px 0 8px}
  .study-head .name{flex:1; font-weight:700; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .scorechip{background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:.82rem; padding:4px 10px; border-radius:99px; font-variant-numeric:tabular-nums}
  .counter{font-variant-numeric:tabular-nums; color:var(--muted); font-size:.9rem; font-weight:600}
  .pbar{height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin:0 0 18px}
  .pbar>i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .35s}

  .qcard{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:22px 20px; border:1px solid var(--line); margin-bottom:14px}
  .qlabel{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); margin-bottom:10px}
  .qtext{font-size:1.17rem; font-weight:600; line-height:1.45; letter-spacing:-.01em}

  .opts{display:flex; flex-direction:column; gap:11px}
  .opt{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer;
    background:var(--card); color:var(--text); border:2px solid var(--line); border-radius:14px;
    padding:14px 15px; font-size:1rem; line-height:1.4; font-weight:500; box-shadow:var(--shadow); transition:transform .08s,border-color .15s,background .15s;
  }
  .opt:active{transform:scale(.985)}
  .opt .key{flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:var(--accent-soft); color:var(--accent);
    font-weight:800; font-size:.85rem; display:flex; align-items:center; justify-content:center; margin-top:1px}
  .opt.correct{border-color:var(--ok); background:var(--ok-soft)}
  .opt.correct .key{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .opt.wrong .key{background:var(--bad); color:#fff}
  .opt.dim{opacity:.5}
  .opt[disabled]{cursor:default}
  .opt .mark{margin-left:auto; font-weight:800; flex:0 0 auto}

  .feedback{margin-top:16px; padding:14px 15px; border-radius:14px; font-weight:600; animation:rise .25s ease}
  .feedback.good{background:var(--ok-soft); color:var(--ok); border-left:5px solid var(--ok)}
  .feedback.bad{background:var(--bad-soft); color:var(--bad); border-left:5px solid var(--bad)}
  .feedback .exp{display:block; margin-top:6px; font-weight:500; color:var(--text); font-size:.95rem}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .next-btn{margin-top:16px; width:100%; border:none; cursor:pointer; border-radius:14px; padding:16px;
    font-size:1.05rem; font-weight:700; color:#fff; background:var(--accent); box-shadow:var(--shadow); transition:transform .1s}
  .next-btn:active{transform:scale(.98)}

  /* Results */
  .finish{text-align:center; padding:26px 16px}
  .ring{width:150px; height:150px; margin:6px auto 14px; position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pc{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring .pc b{font-size:2.1rem; font-weight:800; line-height:1}
  .ring .pc span{font-size:.8rem; color:var(--muted)}
  .finish h2{margin:6px 0 2px}
  .finish .msg{color:var(--muted); margin:0 0 8px}
  .record{display:inline-block; background:#fef9c3; color:#a16207; font-weight:700; font-size:.8rem; padding:4px 12px; border-radius:99px; margin-bottom:18px}
  html[data-theme="dark"] .record{background:#422006; color:#fde047}
  .stack{display:flex; flex-direction:column; gap:10px; max-width:340px; margin:0 auto}
  .btn{border:none; cursor:pointer; border-radius:14px; padding:15px; font-size:1rem; font-weight:700; box-shadow:var(--shadow); transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.ghost{background:var(--card); color:var(--text); border:1px solid var(--line)}
  .btn.warn{background:var(--warn); color:#fff}

  .empty{text-align:center; color:var(--muted); padding:46px 20px}
  .empty .em{font-size:3rem; display:block; margin-bottom:10px}

  .footer{text-align:center; color:var(--muted); font-size:.78rem; margin-top:30px; line-height:1.6}
  .reset-link{background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:.78rem}

  @media(max-width:380px){ body{font-size:16px} .qtext{font-size:1.1rem} .opt{font-size:.95rem} }
</style>
</head>

/* ---------- état & persistance ---------- */
const BEST_KEY="quizdp.best.v1";
const WRONG_KEY="quizdp.wrong.v1";
const THEME_KEY="quizdp.theme";
let best = load(BEST_KEY, {});
let wrong = new Set(load(WRONG_KEY, []));
let session = null;

function load(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function qid(bid,i){ return bid + "#" + i; }
function totalQuestions(){ return QUIZ.reduce((n,b)=>n+b.questions.length,0); }
function questionById(id){ const [bid,idx]=id.split("#"); const b=QUIZ.find(x=>x.id===bid); return {id, bloc:b.title, ...b.questions[+idx]}; }
function allIds(){ const out=[]; QUIZ.forEach(b=>b.questions.forEach((_,i)=>out.push(qid(b.id,i)))); return out; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pct(s,t){ return t? Math.round(s/t*100):0; }

/* ---------- thème ---------- */
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", saved || (sysDark?"dark":"light"));
}
function toggleTheme(){
  const next = document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  document.querySelector('meta[name=theme-color]').setAttribute("content", next==="dark"?"#0f172a":"#2563eb");
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const app = document.getElementById("app");
const KEYS = ["A","B","C","D","E","F"];

/* ---------- accueil ---------- */
function renderHome(){
  session = null;
  const t = totalQuestions();
  const bAll = best["ALL"];
  const wn = wrong.size;

  const blocsHtml = QUIZ.map(b=>{
    const rec = best[b.id];
    const badge = rec ? `<span class="badge">Record ${rec.score}/${rec.total}</span>` : `<span style="color:var(--muted)">Pas encore tenté</span>`;
    return `<div class="bloc" onclick="startBloc('${b.id}')">
      <div class="chip">${esc(b.chip)}</div>
      <div class="info">
        <h3>${esc(b.title)}</h3>
        <div class="meta">${b.questions.length} questions ${badge}</div>
      </div>
      <div class="arrow">›</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar">
      <h1>Quiz Dev Perso</h1>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Thème">◑</button>
    </div>
    <div class="sub">Développement Personnel & Soft Skills</div>

    <div class="globalcard">
      <div class="lbl">QCM interactif</div>
      <div class="big">${t} questions · ${QUIZ.length} blocs</div>
      <div class="row">
        <div><b>${bAll?bAll.pct+"%":"-"}</b> meilleur examen</div>
        <div><b>${wn}</b> à revoir</div>
      </div>
    </div>

    <div class="actions">
      <button class="action primary" onclick="startAll()">
        <span class="em">📝</span>Examen complet<small>${t} questions mélangées</small>
      </button>
      <button class="action" onclick="startWrong()">
        <span class="em">🎯</span>Mes erreurs<small>${wn} question${wn>1?'s':''} à revoir</small>
      </button>
    </div>

    <div class="section-title">Réviser par bloc</div>
    ${blocsHtml}

    <div class="footer">
      Hors ligne · aucune connexion requise · scores enregistrés sur ce téléphone<br>
      <button class="reset-link" onclick="resetAll()">Réinitialiser mes scores</button>
    </div>`;
  window.scrollTo(0,0);
}

/* ---------- démarrage de session ---------- */
function buildItem(id){
  const q = questionById(id);
  const order = shuffle(q.options.map((_,i)=>i));
  const options = order.map(i=>q.options[i]);
  const correct = order.indexOf(q.correct);
  return { id, q:q.q, options, correct, explanation:q.explanation||"", chosen:null };
}
function startSession(ids, title, key){
  session = { title, key, items: ids.map(buildItem), pos:0, score:0 };
  renderQuestion();
}
function startBloc(id){
  const b = QUIZ.find(x=>x.id===id);
  startSession(b.questions.map((_,i)=>qid(id,i)), b.title, id);
}
function startAll(){ startSession(shuffle(allIds()), "Examen complet", "ALL"); }
function startWrong(){
  const ids = [...wrong];
  if(!ids.length){
    app.innerHTML = `<div class="topbar"><button class="icon-btn" onclick="renderHome()">‹</button><h1 style="font-size:1.2rem">Mes erreurs</h1></div>
      <div class="empty"><span class="em">✨</span>Aucune erreur à revoir.<br>Les questions ratées pendant un quiz apparaîtront ici jusqu'à ce que tu les réussisses.</div>
      <div class="stack"><button class="btn primary" onclick="renderHome()">Retour à l'accueil</button></div>`;
    return;
  }
  startSession(shuffle(ids), "Mes erreurs", null);
}

/* ---------- question ---------- */
function renderQuestion(){
  const it = session.items[session.pos];
  const n = session.pos+1, tot = session.items.length;
  const answered = it.chosen!==null;

  const optsHtml = it.options.map((o,i)=>{
    let cls="opt", mark="";
    if(answered){
      if(i===it.correct){ cls+=" correct"; mark='<span class="mark">✓</span>'; }
      else if(i===it.chosen){ cls+=" wrong"; mark='<span class="mark">✗</span>'; }
      else cls+=" dim";
    }
    return `<button class="${cls}" ${answered?'disabled':''} onclick="choose(${i})">
      <span class="key">${KEYS[i]}</span><span>${esc(o)}</span>${mark}</button>`;
  }).join("");

  let feedback="";
  if(answered){
    const good = it.chosen===it.correct;
    feedback = `<div class="feedback ${good?'good':'bad'}">
      ${good?'✅ Bonne réponse !':'❌ Réponse incorrecte'}
      ${it.explanation?`<span class="exp">${esc(it.explanation)}</span>`:''}
    </div>
    <button class="next-btn" onclick="nextQ()">${n===tot?'Voir mon score':'Question suivante ›'}</button>`;
  }

  app.innerHTML = `
    <div class="study-head">
      <button class="icon-btn" onclick="renderHome()" aria-label="Retour">‹</button>
      <div class="name">${esc(session.title)}</div>
      <div class="scorechip">✓ ${session.score}</div>
    </div>
    <div class="pbar"><i style="width:${Math.round(session.pos/tot*100)}%"></i></div>

    <div class="qcard">
      <div class="qlabel">Question ${n} / ${tot}</div>
      <div class="qtext">${esc(it.q)}</div>
    </div>
    <div class="opts">${optsHtml}</div>
    ${feedback}`;
  window.scrollTo(0,0);
}

function choose(i){
  const it = session.items[session.pos];
  if(it.chosen!==null) return;
  it.chosen = i;
  if(i===it.correct){
    session.score++;
    wrong.delete(it.id); save(WRONG_KEY,[...wrong]);
  } else {
    wrong.add(it.id); save(WRONG_KEY,[...wrong]);
  }
  renderQuestion();
}
function nextQ(){
  if(session.pos < session.items.length-1){ session.pos++; renderQuestion(); }
  else renderResult();
}

/* ---------- résultats ---------- */
function renderResult(){
  const s = session.score, t = session.items.length, p = pct(s,t);
  let isRecord = false;
  if(session.key){
    const prev = best[session.key];
    if(!prev || p > prev.pct){ best[session.key] = {score:s,total:t,pct:p}; save(BEST_KEY,best); isRecord = !!prev || true; if(prev && p<=prev.pct) isRecord=false; }
    if(prev && p<=prev.pct) isRecord=false;
  }
  let msg, emo;
  if(p>=90){ msg="Excellent, tu maîtrises !"; emo="🏆"; }
  else if(p>=70){ msg="Bien joué, continue !"; emo="💪"; }
  else if(p>=50){ msg="Pas mal, encore un effort."; emo="📈"; }
  else { msg="À retravailler, on s'accroche !"; emo="🔁"; }

  const wrongIds = session.items.filter(it=>it.chosen!==it.correct).map(it=>it.id);
  const C=2*Math.PI*52, off=C*(1-p/100);
  const ringColor = p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--bad)';

  app.innerHTML = `
    <div class="finish">
      <div style="font-size:2.4rem">${emo}</div>
      <div class="ring">
        <svg width="150" height="150">
          <circle cx="75" cy="75" r="52" fill="none" stroke="var(--line)" stroke-width="12"/>
          <circle cx="75" cy="75" r="52" fill="none" stroke="${ringColor}" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="pc"><b>${p}%</b><span>${s} / ${t}</span></div>
      </div>
      <h2>${esc(session.title)}</h2>
      <div class="msg">${msg}</div>
      ${isRecord?`<div class="record">🎉 Nouveau record !</div>`:``}
      <div class="stack">
        ${wrongIds.length?`<button class="btn warn" onclick='retryWrong(${JSON.stringify(wrongIds)})'>🎯 ${wrongIds.length>1?`Revoir mes ${wrongIds.length} erreurs`:`Revoir mon erreur`}</button>`:``}
        <button class="btn ghost" onclick="restart()">↻ Recommencer ce quiz</button>
        <button class="btn primary" onclick="renderHome()">🏠 Accueil</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
  finishCache = { ids: session.items.map(it=>it.id), title: session.title, key: session.key };
}
let finishCache=null;
function restart(){ startSession(shuffle(finishCache.ids), finishCache.title, finishCache.key); }
function retryWrong(ids){ startSession(shuffle(ids), "Mes erreurs", null); }

function resetAll(){
  if(confirm("Réinitialiser tous tes scores et la liste « à revoir » ?")){
    best={}; wrong=new Set(); save(BEST_KEY,best); save(WRONG_KEY,[]); renderHome();
  }
}

/* ---------- clavier (confort ordinateur) ---------- */
document.addEventListener("keydown", e=>{
  if(!session) return;
  const it = session.items[session.pos];
  if(it && it.chosen===null){
    const k = ["a","b","c","d"].indexOf(e.key.toLowerCase());
    if(k>=0 && k<it.options.length){ choose(k); }
    else if(["1","2","3","4"].includes(e.key)){ const n=+e.key-1; if(n<it.options.length) choose(n); }
  } else if(it && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); nextQ(); }
});

/* ---------- go ---------- */
initTheme();
renderHome();
</script>
