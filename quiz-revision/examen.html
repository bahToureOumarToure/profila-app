<title>Évaluation - Développement Personnel</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --accent:#7c3aed; --accent-soft:#ede9fe;
    --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2; --warn:#ea580c;
    --shadow:0 6px 22px rgba(15,23,42,.08); --radius:18px;
  }
  html[data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
    --line:#334155; --accent:#a78bfa; --accent-soft:#3b2a63;
    --ok:#22c55e; --ok-soft:#14532d; --bad:#f87171; --bad-soft:#4c1d1d; --warn:#fb923c;
    --shadow:0 6px 22px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px; line-height:1.55;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased; transition:background .2s,color .2s;
  }
  .wrap{max-width:680px; margin:0 auto; padding:16px 16px 48px;}

  .topbar{display:flex; align-items:center; gap:12px; margin:6px 0 4px;}
  .topbar h1{font-size:1.4rem; margin:0; letter-spacing:-.02em; flex:1}
  .icon-btn{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    width:42px; height:42px; border-radius:12px; font-size:1.2rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; transition:transform .1s;
  }
  .icon-btn:active{transform:scale(.92)}

  /* Start */
  .hero{
    background:linear-gradient(135deg,var(--accent),#2563eb);
    color:#fff; border-radius:22px; padding:30px 24px; box-shadow:var(--shadow); text-align:center; margin:8px 0 22px;
  }
  .hero .em{font-size:3rem}
  .hero h2{margin:8px 0 6px; font-size:1.55rem; letter-spacing:-.02em}
  .hero p{margin:0; opacity:.92; font-size:.95rem}
  .hero .best{margin-top:14px; display:inline-block; background:rgba(255,255,255,.2); padding:5px 14px; border-radius:99px; font-weight:700; font-size:.85rem}

  .info-list{list-style:none; padding:0; margin:0 0 22px}
  .info-list li{display:flex; gap:12px; align-items:flex-start; background:var(--card); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px; font-size:.95rem}
  .info-list .ic{font-size:1.3rem; flex:0 0 auto}

  .btn{border:none; cursor:pointer; border-radius:14px; padding:16px; font-size:1.05rem; font-weight:700;
    box-shadow:var(--shadow); transition:transform .1s; width:100%}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.ghost{background:var(--card); color:var(--text); border:1px solid var(--line)}

  /* Question */
  .study-head{display:flex; align-items:center; gap:10px; margin:6px 0 8px}
  .study-head .name{flex:1; font-weight:700; font-size:1rem; color:var(--muted)}
  .counter{font-variant-numeric:tabular-nums; color:var(--accent); font-size:.9rem; font-weight:800}
  .pbar{height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin:0 0 18px}
  .pbar>i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .35s}

  .qcard{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:22px 20px; border:1px solid var(--line); margin-bottom:14px}
  .qlabel{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); margin-bottom:10px}
  .qtext{font-size:1.17rem; font-weight:600; line-height:1.45; letter-spacing:-.01em}

  .opts{display:flex; flex-direction:column; gap:11px}
  .opt{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; cursor:pointer;
    background:var(--card); color:var(--text); border:2px solid var(--line); border-radius:14px;
    padding:14px 15px; font-size:1rem; line-height:1.4; font-weight:500; box-shadow:var(--shadow);
    transition:transform .08s,border-color .15s,background .15s;
  }
  .opt:active{transform:scale(.985)}
  .opt .key{flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:var(--accent-soft); color:var(--accent);
    font-weight:800; font-size:.85rem; display:flex; align-items:center; justify-content:center; margin-top:1px}
  .opt.sel{border-color:var(--accent); background:var(--accent-soft)}
  .opt.sel .key{background:var(--accent); color:#fff}

  .nav{display:flex; gap:10px; margin-top:16px}
  .nav .skip{flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--muted);
    border-radius:14px; padding:16px 18px; font-weight:600; cursor:pointer}
  .next-btn{flex:1; border:none; cursor:pointer; border-radius:14px; padding:16px; font-size:1.05rem; font-weight:700;
    color:#fff; background:var(--accent); box-shadow:var(--shadow); transition:transform .1s}
  .next-btn:disabled{opacity:.45}
  .next-btn:active{transform:scale(.98)}

  /* Result */
  .finish{text-align:center; padding:22px 4px 8px}
  .ring{width:160px; height:160px; margin:6px auto 14px; position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pc{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring .pc b{font-size:2.3rem; font-weight:800; line-height:1}
  .ring .pc span{font-size:.82rem; color:var(--muted)}
  .finish h2{margin:6px 0 2px}
  .finish .msg{color:var(--muted); margin:0 0 16px}
  .record{display:inline-block; background:#fef9c3; color:#a16207; font-weight:700; font-size:.8rem; padding:4px 12px; border-radius:99px; margin-bottom:8px}
  html[data-theme="dark"] .record{background:#422006; color:#fde047}

  .section-title{font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:700; margin:24px 4px 12px; text-align:left}
  .ritem{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:16px 16px; margin-bottom:12px; text-align:left}
  .ritem .rq{font-weight:600; font-size:1rem; margin-bottom:10px}
  .ritem .rq .num{color:var(--accent); font-weight:800; margin-right:6px}
  .ritem .ro{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border-radius:10px; font-size:.93rem; margin-bottom:5px; border:1px solid transparent}
  .ritem .ro .ic{flex:0 0 auto; font-weight:800}
  .ritem .ro.good{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)}
  .ritem .ro.bad{background:var(--bad-soft); color:var(--bad); border-color:var(--bad)}
  .ritem .ro.norm{color:var(--muted)}
  .ritem .exp{margin-top:8px; font-size:.88rem; color:var(--muted); font-style:italic}
  .tag{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:99px; margin-bottom:8px}
  .tag.ok{background:var(--ok-soft); color:var(--ok)} .tag.ko{background:var(--bad-soft); color:var(--bad)}

  .stack{display:flex; flex-direction:column; gap:10px; max-width:360px; margin:14px auto 0}
  .footer{text-align:center; color:var(--muted); font-size:.78rem; margin-top:30px; line-height:1.6}
  @media(max-width:380px){ body{font-size:16px} .qtext{font-size:1.1rem} .opt{font-size:.95rem} }
</style>
</head>

const BEST_KEY="examdp.best.v1";
const THEME_KEY="examdp.theme";
let exam = null;

function load(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pct(s,t){ return t? Math.round(s/t*100):0; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const KEYS=["A","B","C","D","E","F"];
const app=document.getElementById("app");

function initTheme(){
  const saved=localStorage.getItem(THEME_KEY);
  const sysDark=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", saved||(sysDark?"dark":"light"));
}
function toggleTheme(){
  const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
  document.querySelector('meta[name=theme-color]').setAttribute("content", next==="dark"?"#0f172a":"#7c3aed");
}

/* toutes les questions, tous blocs confondus (sans titre de bloc) */
function pool(){ const out=[]; QUIZ.forEach(b=>b.questions.forEach(q=>out.push(q))); return out; }

function renderStart(){
  exam=null;
  const t=pool().length;
  const best=load(BEST_KEY,null);
  app.innerHTML = `
    <div class="topbar">
      <h1>Évaluation</h1>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Thème">◑</button>
    </div>
    <div class="hero">
      <div class="em">🎓</div>
      <h2>Teste ta compréhension</h2>
      <p>${t} questions mélangées, tous les thèmes en aléatoire</p>
      ${best!=null?`<div class="best">🏅 Meilleur score : ${best}%</div>`:``}
    </div>
    <ul class="info-list">
      <li><span class="ic">🔀</span><span>Questions et propositions <b>mélangées</b> à chaque tentative.</span></li>
      <li><span class="ic">🙈</span><span>Aucune correction pendant le test - tu découvres ton <b>score à la fin</b>.</span></li>
      <li><span class="ic">📋</span><span>Correction détaillée <b>après</b> : tes réponses vs les bonnes.</span></li>
    </ul>
    <button class="btn primary" onclick="startExam()">Commencer l'évaluation</button>
    <div class="footer">Hors ligne · aucune connexion requise</div>`;
  window.scrollTo(0,0);
}

function buildItem(q){
  const order=shuffle(q.options.map((_,i)=>i));
  return { q:q.q, options:order.map(i=>q.options[i]), correct:order.indexOf(q.correct), explanation:q.explanation||"", chosen:null };
}
function startExam(){
  exam={ items: shuffle(pool()).map(buildItem), pos:0 };
  renderQuestion();
}

function renderQuestion(){
  const it=exam.items[exam.pos];
  const n=exam.pos+1, tot=exam.items.length;
  const optsHtml=it.options.map((o,i)=>{
    const cls="opt"+(it.chosen===i?" sel":"");
    return `<button class="${cls}" onclick="select(${i})"><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const last=n===tot;
  app.innerHTML = `
    <div class="study-head">
      <button class="icon-btn" onclick="quit()" aria-label="Quitter">‹</button>
      <div class="name">Évaluation</div>
      <div class="counter">${n} / ${tot}</div>
    </div>
    <div class="pbar"><i style="width:${Math.round(exam.pos/tot*100)}%"></i></div>
    <div class="qcard">
      <div class="qlabel">Question ${n}</div>
      <div class="qtext">${esc(it.q)}</div>
    </div>
    <div class="opts">${optsHtml}</div>
    <div class="nav">
      <button class="skip" onclick="nextQ()">Passer</button>
      <button class="next-btn" ${it.chosen===null?'disabled':''} onclick="nextQ()">${last?'Terminer':'Suivant ›'}</button>
    </div>`;
  window.scrollTo(0,0);
}
function select(i){ exam.items[exam.pos].chosen=i; renderQuestion(); }
function nextQ(){ if(exam.pos<exam.items.length-1){ exam.pos++; renderQuestion(); } else renderResult(); }
function quit(){ if(confirm("Quitter l'évaluation en cours ? Ta progression sera perdue.")) renderStart(); }

function renderResult(){
  const its=exam.items, t=its.length;
  let s=0; its.forEach(it=>{ if(it.chosen===it.correct) s++; });
  const p=pct(s,t);
  const prev=load(BEST_KEY,null);
  let isRecord=false;
  if(prev==null || p>prev){ isRecord = prev!=null; save(BEST_KEY,p); }
  if(prev==null) isRecord=false;

  let msg,emo;
  if(p>=90){ msg="Excellent, tu maîtrises le programme !"; emo="🏆"; }
  else if(p>=70){ msg="Bonne compréhension, continue !"; emo="💪"; }
  else if(p>=50){ msg="Des bases à consolider."; emo="📈"; }
  else { msg="À retravailler en priorité."; emo="🔁"; }

  const C=2*Math.PI*56, off=C*(1-p/100);
  const ringColor=p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--bad)';
  const wrongN=t-s;

  const review=its.map((it,qi)=>{
    const good=it.chosen===it.correct;
    const opts=it.options.map((o,i)=>{
      let cls="ro norm", ic="";
      if(i===it.correct){ cls="ro good"; ic="✓"; }
      else if(i===it.chosen){ cls="ro bad"; ic="✗"; }
      return `<div class="${cls}"><span class="ic">${ic||'&nbsp;'}</span><span>${esc(o)}</span></div>`;
    }).join("");
    const unanswered = it.chosen===null ? `<div class="ro bad"><span class="ic">!</span><span>Pas de réponse donnée</span></div>` : "";
    return `<div class="ritem">
      <span class="tag ${good?'ok':'ko'}">${good?'Correct':'À revoir'}</span>
      <div class="rq"><span class="num">Q${qi+1}.</span>${esc(it.q)}</div>
      ${opts}${unanswered}
      ${it.explanation?`<div class="exp">${esc(it.explanation)}</div>`:''}
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar"><h1>Résultat</h1><button class="icon-btn" onclick="toggleTheme()">◑</button></div>
    <div class="finish">
      <div style="font-size:2.4rem">${emo}</div>
      <div class="ring">
        <svg width="160" height="160">
          <circle cx="80" cy="80" r="56" fill="none" stroke="var(--line)" stroke-width="13"/>
          <circle cx="80" cy="80" r="56" fill="none" stroke="${ringColor}" stroke-width="13"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="pc"><b>${p}%</b><span>${s} / ${t} bonnes</span></div>
      </div>
      ${isRecord?`<div class="record">🎉 Nouveau record !</div>`:``}
      <h2>${s} bonnes · ${wrongN} à revoir</h2>
      <div class="msg">${msg}</div>
      <div class="stack">
        <button class="btn primary" onclick="startExam()">↻ Nouvelle évaluation</button>
        <button class="btn ghost" onclick="renderStart()">🏠 Accueil</button>
      </div>
    </div>
    <div class="section-title">Correction détaillée</div>
    ${review}
    <div class="stack"><button class="btn primary" onclick="startExam()">↻ Nouvelle évaluation</button></div>`;
  window.scrollTo(0,0);
}

/* clavier (ordinateur) */
document.addEventListener("keydown", e=>{
  if(!exam) return;
  const it=exam.items[exam.pos]; if(!it) return;
  const k=["a","b","c","d"].indexOf(e.key.toLowerCase());
  if(k>=0 && k<it.options.length){ select(k); }
  else if(["1","2","3","4"].includes(e.key)){ const n=+e.key-1; if(n<it.options.length) select(n); }
  else if((e.key==="Enter"||e.key===" ") && it.chosen!==null){ e.preventDefault(); nextQ(); }
});

initTheme();
renderStart();
</script>
